
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Paper.io - Territory Rush</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #080d18;
  color: white;
  font-family: system-ui, sans-serif;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#startScreen {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 45%,
      #182d50 0%, #0b1426 50%, #080d18 100%);
}

#startBtn {
  width: min(72vw, 330px);
  height: 100px;
  border: 0;
  border-radius: 30px;
  color: white;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(145deg, #62e8ff, #2585ff);
  box-shadow:
    0 12px 0 #1453a5,
    0 25px 60px #2585ff55,
    inset 0 3px 5px #ffffff77;
  cursor: pointer;
  transition: transform .15s;
}

#startBtn:active {
  transform: translateY(8px);
  box-shadow: 0 4px 0 #1453a5;
}

#hud {
  position: fixed;
  top: 18px;
  left: 0;
  width: 100%;
  padding: 0 20px;
  display: none;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

.stat {
  padding: 10px 16px;
  border-radius: 18px;
  background: #101a2add;
  border: 1px solid #ffffff20;
  backdrop-filter: blur(12px);
  font-size: 13px;
  color: #a9c1e4;
}

.stat strong {
  display: block;
  font-size: 22px;
  color: white;
}

#joystick {
  position: fixed;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 150px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 35% 25%,
    #ffffff25, #ffffff08 60%, #00000025);
  border: 2px solid #ffffff30;
  box-shadow:
    inset 0 5px 15px #ffffff12,
    0 15px 35px #00000055;
  touch-action: none;
}

#stick {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: linear-gradient(145deg, #ffffff, #9bb9e9);
  box-shadow:
    0 7px 0 #526e9b,
    0 12px 25px #00000055,
    inset 0 3px 8px white;
  transform: translate(0, 0);
}

#gameOver {
  display: none;
  position: fixed;
  inset: 0;
  background: #050a14dd;
  backdrop-filter: blur(10px);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}

#gameOver h1 {
  font-size: 42px;
  margin: 0;
}

#restart {
  padding: 18px 35px;
  border: 0;
  border-radius: 20px;
  background: #398bff;
  color: white;
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="startScreen">
  <button id="startBtn">START</button>
</div>

<div id="hud">
  <div class="stat">
    TERRITORY
    <strong id="score">0%</strong>
  </div>
  <div class="stat">
    BEST
    <strong id="best">0%</strong>
  </div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <div id="finalScore">Territory: 0%</div>
  <button id="restart">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const hud = document.getElementById("hud");
const gameOver = document.getElementById("gameOver");

let W, H, dpr;
let running = false;
let lastTime = 0;
let accumulator = 0;

const CELL = 18;
let cols, rows, grid;
let trail = [];
let player;
let bot;

let joy = { x: 0, y: 0 };
let joyActive = false;
let joyPointer = null;

let score = 0;
let best = 0;

const colors = {
  background: "#101827",
  grid: "#1b2940",
  player: "#38c9ff",
  bot: "#ff5978",
  neutral: "#17243a"
};

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;

  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cols = Math.ceil(W / CELL);
  rows = Math.ceil(H / CELL);

  if (!grid) resetGame();
}

window.addEventListener("resize", resize);

function resetGame() {
  cols = Math.ceil(W / CELL);
  rows = Math.ceil(H / CELL);

  grid = new Uint8Array(cols * rows);
  trail = [];

  player = {
    x: Math.floor(cols / 2),
    y: Math.floor(rows / 2),
    dx: 1,
    dy: 0,
    progress: 0,
    speed: 5.5
  };

  bot = {
    x: Math.floor(cols * 0.2),
    y: Math.floor(rows * 0.25),
    dx: 1,
    dy: 0,
    progress: 0,
    speed: 4.5
  };

  // Starting territory
  for (let y = player.y - 2; y <= player.y + 2; y++) {
    for (let x = player.x - 2; x <= player.x + 2; x++) {
      setCell(x, y, 1);
    }
  }

  // Opponent's starting territory
  for (let y = bot.y - 2; y <= bot.y + 2; y++) {
    for (let x = bot.x - 2; x <= bot.x + 2; x++) {
      setCell(x, y, 2);
    }
  }

  score = 0;
  updateScore();
}

function index(x, y) {
  return y * cols + x;
}

function inside(x, y) {
  return x >= 0 && y >= 0 && x < cols && y < rows;
}

function getCell(x, y) {
  if (!inside(x, y)) return -1;
  return grid[index(x, y)];
}

function setCell(x, y, value) {
  if (inside(x, y)) {
    grid[index(x, y)] = value;
  }
}

function updateScore() {
  let owned = 0;

  for (let i = 0; i < grid.length; i++) {
    if (grid[i] === 1) owned++;
  }

  score = Math.round(owned / grid.length * 100);

  document.getElementById("score").textContent = score + "%";

  best = Math.max(best, score);

  document.getElementById("best").textContent = best + "%";
}

function capture() {
  if (trail.length === 0) return;

  for (const p of trail) {
    setCell(p.x, p.y, 1);
  }

  // Fill enclosed territory using flood fill
  const visited = new Uint8Array(grid.length);
  const queue = [];

  for (let x = 0; x < cols; x++) {
    addOutside(x, 0);
    addOutside(x, rows - 1);
  }

  for (let y = 0; y < rows; y++) {
    addOutside(0, y);
    addOutside(cols - 1, y);
  }

  function addOutside(x, y) {
    const i = index(x, y);

    if (!visited[i] && grid[i] !== 1) {
      visited[i] = 1;
      queue.push({ x, y });
    }
  }

  for (let q = 0; q < queue.length; q++) {
    const p = queue[q];

    addOutside(p.x + 1, p.y);
    addOutside(p.x - 1, p.y);
    addOutside(p.x, p.y + 1);
    addOutside(p.x, p.y - 1);
  }

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = index(x, y);

      if (!visited[i] && grid[i] !== 2) {
        grid[i] = 1;
      }
    }
  }

  trail = [];
  updateScore();
}

function moveEntity(entity, dt, isPlayer) {
  entity.progress += entity.speed * dt;

  while (entity.progress >= 1) {
    entity.progress -= 1;

    if (isPlayer) {
      if (Math.abs(joy.x) > 0.3 || Math.abs(joy.y) > 0.3) {
        if (Math.abs(joy.x) > Math.abs(joy.y)) {
          entity.dx = Math.sign(joy.x);
          entity.dy = 0;
        } else {
          entity.dx = 0;
          entity.dy = Math.sign(joy.y);
        }
      }
    } else {
      if (Math.random() < 0.12) {
        const dirs = [
          [1, 0], [-1, 0], [0, 1], [0, -1]
        ];

        const d = dirs[Math.floor(Math.random() * dirs.length)];
        entity.dx = d[0];
        entity.dy = d[1];
      }
    }

    const nx = entity.x + entity.dx;
    const ny = entity.y + entity.dy;

    if (!inside(nx, ny)) {
      entity.dx *= -1;
      entity.dy *= -1;
      continue;
    }

    entity.x = nx;
    entity.y = ny;

    const owner = getCell(nx, ny);

    if (isPlayer) {
      if (owner === 2) {
        // Player can move through opponent territory
      }

      if (owner !== 1) {
        trail.push({ x: nx, y: ny });
      } else if (trail.length > 0) {
        capture();
      }

      // Opponent touches the player's trail
      if (trail.some(p => p.x === bot.x && p.y === bot.y)) {
        trail = [];
      }
    } else {
      // Opponent territory expansion
      if (owner === 0) {
        setCell(nx, ny, 2);
      }
    }
  }
}

function drawCell(x, y, color) {
  const px = x * CELL;
  const py = y * CELL;

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(px + 1, py + 1, CELL - 2, CELL - 2, 4);
  ctx.fill();
}

function draw() {
  ctx.fillStyle = colors.background;
  ctx.fillRect(0, 0, W, H);

  // Background grid
  ctx.strokeStyle = colors.grid;
  ctx.lineWidth = 0.6;

  for (let x = 0; x < W; x += CELL) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (let y = 0; y < H; y += CELL) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Territory
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const owner = getCell(x, y);

      if (owner === 1) {
        drawCell(x, y, "#1686b9");
      } else if (owner === 2) {
        drawCell(x, y, "#a32c4c");
      }
    }
  }

  // Player trail
  for (const p of trail) {
    drawCell(p.x, p.y, "#7beaff");
  }

  drawPlayer(player, "#63eaff");
  drawPlayer(bot, "#ff7a97");
}

function drawPlayer(entity, color) {
  const x = (entity.x + 0.5) * CELL;
  const y = (entity.y + 0.5) * CELL;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 18;

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, CELL * 0.38, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(x - 3, y - 3, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function loop(time) {
  if (!running) return;

  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  accumulator += dt;

  while (accumulator >= 1 / 60) {
    moveEntity(player, 1 / 60, true);
    moveEntity(bot, 1 / 60, false);
    accumulator -= 1 / 60;
  }

  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  resetGame();

  startScreen.style.display = "none";
  gameOver.style.display = "none";
  hud.style.display = "flex";
  joystick.style.display = "flex";

  running = true;
  lastTime = performance.now();

  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", startGame);
document.getElementById("restart").addEventListener("click", startGame);

// Virtual joystick
joystick.addEventListener("pointerdown", e => {
  joyActive = true;
  joyPointer = e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystick.addEventListener("pointermove", e => {
  if (joyActive && e.pointerId === joyPointer) {
    updateJoystick(e);
  }
});

function updateJoystick(e) {
  const rect = joystick.getBoundingClientRect();

  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let dx = e.clientX - cx;
  let dy = e.clientY - cy;

  const distance = Math.hypot(dx, dy);
  const max = 45;

  if (distance > max) {
    dx = dx / distance * max;
    dy = dy / distance * max;
  }

  joy.x = dx / max;
  joy.y = dy / max;

  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}

function releaseJoystick() {
  joyActive = false;
  joyPointer = null;
  joy.x = 0;
  joy.y = 0;
  stick.style.transform = "translate(0, 0)";
}

joystick.addEventListener("pointerup", releaseJoystick);
joystick.addEventListener("pointercancel", releaseJoystick);

resize();
draw();
</script>
</body>
</html>
